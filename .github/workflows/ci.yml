name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip2
      - run: cargo build -p md-ens-signature --target wasm32-unknown-unknown
      - run: cargo build -p md-ens-signature --target wasm32-wasip2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108
      - run: deno task build-wasm
      - run: deno install
      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - run: deno task lit-check
      - run: deno task import-check
      - run: deno task test
      - run: deno task build
        env:
          MDSIG_BASE: /mdtp/
