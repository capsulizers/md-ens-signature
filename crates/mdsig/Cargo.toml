[package]
name = "mdsig"
description = "Sign and inspect Markdown files signed with an ENS name."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { version = "1.7.3", default-features = false, features = ["k256", "rlp"] }
alloy-rlp = "0.3"
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
md-ens-signature = { path = "../md-ens-signature" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
