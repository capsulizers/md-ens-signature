[package]
name = "mdsig"
description = "Sign and inspect Markdown files signed with an ENS name."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { version = "1.7.3", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
md-ens-signature = { path = "../md-ens-signature" }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
