[package]
name = "md-ens-signature-wasm"
description = "JavaScript bindings for md-ens-signature, built with wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy-primitives = { version = "1.7.3", default-features = false }
anyhow = "1.0.104"
js-sys = "0.3"
md-ens-signature = { path = "../md-ens-signature" }
serde_json = "1.0.151"
# Must match the installed `wasm-bindgen` CLI exactly.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "Response"] }

