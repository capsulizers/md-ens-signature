[package]
name = "md-ens-signature"
description = "Sign Markdown files with an ENS name and verify them against ENSv2 permissions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { version = "1.7.3", default-features = false, features = ["k256"] }
alloy-sol-types = { version = "1.7.3", default-features = false }
anyhow = "1.0.104"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde_json = "1.0.151"
sha2 = { version = "0.10", default-features = false }
